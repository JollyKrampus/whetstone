    date: "2026-10-08"
  - what: Heroes Profile maps list, ranked_rotation flag (14 maps)
    date: "2026-10-08"
  - what: Blizzard live patch notes, "Haunted Mines has been added to Ranked"
    url: https://news.blizzard.com/en-us/article/24291432/
    date: "2026-07-20"
  - what: Blizzard patch notes announcing Blackheart's Bay, Hanamura Temple and Warhead Junction for Ranked
    date: "2025-09-30"
