hero: arthas
reviewedFor: "2.57"
traits:
  - tag: frontline
    why: "2750 health, a self-cast Death Coil and ghoul sacrifices from Army of the Dead let him hold the front line through long fights."
  - tag: peel
    why: "Howling Blast's root and Frozen Tempest's movement and attack-speed slows stop melee divers from reaching his backline."
  - tag: mana-hungry
    why: "Frozen Tempest drains mana every second it runs, so he leans on Frostmourne Hungers' 40-mana refund to keep it up."
