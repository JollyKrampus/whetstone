  - a: xalatath
    b: sgthammer
    why: "A sieging Sgt. Hammer stands still, so Shadow Mark's center hit and the Dark Heart's chase-and-detonate land reliably; she can't step away without dropping Siege Mode."
    evidence: ["Shadow Mark", "Dark Heart Ritual", "Siege Mode"]
    confidence: low
  - a: xalatath
    b: nova
    why: "Shadow Mark reveals a marked Nova for 4 seconds and the Dark Heart chases her down, stopping her from slipping back into Permanent Cloak at 1300 Health."
