hero: xalatath
reviewedFor: "2.57"
traits:
  - tag: poke
    why: "Shadow Mark and Void Volley chip enemies from long range, and the Dark Heart chases marked targets, so she softens teams before fights start."
  - tag: burst
    why: "A fully charged Void Eruption explodes for up to 700 damage at the end of its path, a big punish on anyone caught in it."
counters:
