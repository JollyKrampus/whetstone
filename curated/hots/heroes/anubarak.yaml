hero: anubarak
reviewedFor: "2.57"
traits:
  - tag: engage
    why: "Burrow Charge travels underground to a target area and stuns on arrival, letting him open a fight from outside the enemy's sight line."
  - tag: peel
    why: "Impale's line stun and Cocoon, which removes an enemy for up to 7 seconds, keep divers off his backline."
