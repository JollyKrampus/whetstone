hero: kaelthas
reviewedFor: "2.57"
traits:
  - tag: immobile
    why: "Kael'thas has no dash, blink or self-protection in his base kit, so he relies on Gravity Lapse and his frontline to survive divers."
  - tag: burst
    why: "Verdant Spheres empowers Flamestrike or Living Bomb, and with Burned Flesh or Pyroblast one good cast becomes a kill on clustered or isolated targets."
  - tag: mana-hungry
    why: "Flamestrike costs 70 and Gravity Lapse 90 Mana, so without Mana Tap or Energy Roil he can run out mid-fight."
