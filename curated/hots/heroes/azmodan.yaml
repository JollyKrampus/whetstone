hero: azmodan
reviewedFor: "2.57"
traits:
  - tag: immobile
    why: "Azmodan has no dash or blink in his base kit and All Shall Burn slows him further, so divers catch him easily."
  - tag: channel
    why: "All Shall Burn only pays out its big final hit if the 2.5-second channel completes, so stuns and displacement waste it."
  - tag: siege
    why: "Demon Warriors and Demon Lieutenants keep pushing lanes on their own, so he pressures structures while also fighting."
