hero: rehgar
reviewedFor: "2.57"
traits:
  - tag: save
    why: "Purge on an ally grants a brief Unstoppable that breaks stuns and roots, and Ancestral Healing restores over a thousand Health in one cast."
  - tag: peel
    why: "Earthbind Totem's slow zone and Purge's 80% Slow on an enemy drag divers to a crawl before they reach his backline."
counters:
  # --- strong against ---
  - a: rehgar
    b: murky
    why: "Purge on an ally grants Unstoppable, which breaks Octo-Grab's 3-second stun early and removes most of the kill pressure Murky's heroic is built around."
    evidence: ["Purge", "Octo-Grab"]
    conditions: "Murky takes Octo-Grab (level 10)"
    confidence: low
  - a: rehgar
    b: kerrigan
    why: "Kerrigan's kills rely on chaining Ravage into Impaling Blades' stun and Primal Grasp; Purge's Unstoppable breaks the stun mid-combo and Earthbind Totem slows her follow-up."
    evidence: ["Purge", "Earthbind Totem", "Impaling Blades", "Primal Grasp", "Ravage"]
    confidence: low
  - a: rehgar
    b: thebutcher
    why: "Purge's 80% Slow and Earthbind Totem drag The Butcher to a crawl once Ruthless Onslaught is spent, and Grounded Totem (level 7) also trims his attack speed."
    evidence: ["Purge", "Earthbind Totem", "Grounded Totem", "Ruthless Onslaught"]
    confidence: low
  # --- weak against ---
  - a: ana
    b: rehgar
    why: "Biotic Grenade blocks all healing on the enemies it hits, so a well-timed grenade wastes Chain Heal or, if he takes it, Ancestral Healing's big single heal."
    evidence: ["Biotic Grenade", "Chain Heal", "Ancestral Healing"]
    confidence: medium
  - a: valeera
    b: rehgar
    why: "Garrote (Eviscerate from Stealth) silences Rehgar so he can't Chain Heal or Purge, and Wound Poison (level 4) halves the healing on whoever Valeera is hitting."
    evidence: ["Eviscerate", "Vanish", "Wound Poison", "Chain Heal", "Purge"]
    confidence: low
  - a: stukov
    b: rehgar
    why: "Rehgar must stand close to attack and keep Lightning Shield value; Lurking Arm silences him in its zone, shutting off Chain Heal and Purge while he is inside."
    evidence: ["Lurking Arm", "Chain Heal", "Purge"]
    confidence: low
synergies:
