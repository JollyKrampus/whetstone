hero: hogger
reviewedFor: "2.57"
traits:
  - tag: frontline
    why: "With 2260 Health, Dust Devil Armor and Meat healing from Loot Hoard, Hogger is built to stand in the middle of a brawl rather than poke from behind."
  - tag: engage
    why: "Hogg Wild makes him Unstoppable while he spins in the chosen direction, so he can start a fight through crowd control that stops most bruisers."
  - tag: peel
    why: "Staggering Blow knocks melee off a carry and stuns them on terrain, and a Loot Hoard dropped behind them can supply that wall on demand."
counters:
