    conditions: "the Vikings fight together rather than split across lanes"
    confidence: medium
  - a: hogger
    b: samuro
    why: "Mirror Images take double damage, and Hogg Wild's area damage (plus Garbage Fire's at level 7) shreds the images while still hitting the real Samuro, taking away his main way to split and juke."
