hero: sylvanas
reviewedFor: "2.57"
traits:
  - tag: split-push
    why: "Possession steals enemy minions and Haunting Arrows can stun structures, so Sylvanas pushes a lane down quickly on her own."
  - tag: waveclear
    why: "Shadow Dagger spreads from her damage to every nearby enemy, so Sylvanas clears whole minion waves fast."
counters:
  # --- strong against ---
  - a: sylvanas
    b: probius
    why: "Haunting Arrows makes Sylvanas' attacks and abilities stun Structures, which shuts down Probius' Photon Cannons and Pylons while she pushes into them."
    evidence: ["Haunting Arrows", "Photon Cannon", "Warp In Pylon"]
    conditions: "Sylvanas takes Haunting Arrows (level 4)"
    confidence: low
  - a: sylvanas
    b: thelostvikings
    why: "Shadow Dagger spreads from Sylvanas' damage to every nearby enemy, so grouped Vikings all take it, and Withering Fire picks off a lone soaking Viking."
