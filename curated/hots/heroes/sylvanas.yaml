    confidence: low
  - a: sylvanas
    b: nazeebo
    why: "Either Heroic interrupts Ravenous Spirit, Nazeebo's stationary channel (Wailing Arrow's Silence or Mind Control), and Shadow Dagger's spread clears his Corpse Spiders."
