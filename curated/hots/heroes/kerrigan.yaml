hero: kerrigan
reviewedFor: "2.57"
traits:
  - tag: dive
    why: "Ravage leaps straight onto a target, and Boundless Fury or Queen of Blades let her chain leaps deep into the backline."
  - tag: burst
    why: "Primal Grasp into Impaling Blades, then Ravage and Basic Attacks, kills squishy Heroes in a few seconds."
  - tag: mana-hungry
    why: "Impaling Blades costs 80 and Primal Grasp 65 Mana, so a couple of full combos drain her quickly."
counters:
