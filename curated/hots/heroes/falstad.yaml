    why: "Flight carries Falstad across the map over terrain, letting him join fights or gank a lane from anywhere."
  - tag: aa-reliant
    why: "Many of his builds (Frequent Flyer, Secret Weapon, Sustained Winds, Nexus Frenzy) scale his basic attacks, so blinds blunt him."
