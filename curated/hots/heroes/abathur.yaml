hero: abathur
reviewedFor: "2.57"
traits:
  - tag: vulnerable-body
    why: "While he steers a Symbiote, Abathur's own 685-health body sits alone and nearly defenceless, so hunting it down is the standard answer to him."
  - tag: global
    why: "Symbiote can be cast on any allied hero or structure and Deep Tunnel relocates him, so he affects any lane or fight without walking there."
  - tag: split-push
    why: "Locust Strain waves and an evolved Monstrosity keep a side lane pushed while Abathur himself is helping a fight elsewhere."
