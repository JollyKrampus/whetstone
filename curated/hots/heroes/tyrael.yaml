    evidence: ["Judgment", "El'druin's Might", "Siege Mode", "Thrusters"]
    confidence: low
  - a: tyrael
    b: kaelthas
    why: "Sanctification makes allies Invulnerable for 3 seconds, wasting Pyroblast or a Gravity Lapse into Flamestrike combo aimed at them."
