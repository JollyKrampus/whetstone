hero: tyrael
reviewedFor: "2.57"
traits:
  - tag: engage
    why: "Judgment charges and stuns a Hero after a short wind-up, and El'druin's Might lets Tyrael teleport in behind its slow."
  - tag: save
    why: "Sanctification makes every allied Hero inside Invulnerable for 3 seconds, cancelling an enemy burst combo."
  - tag: frontline
    why: "Righteousness shields him and his allies, and Archangel's Wrath keeps him dangerous even after he dies, so he anchors the front."
