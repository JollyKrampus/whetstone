hero: deckard
reviewedFor: "2.57"
traits:
  - tag: immobile
    why: "Deckard has no dash or blink, so his safety depends on landing Scroll of Sealing and Horadric Cube."
  - tag: channel
    why: "Stay Awhile and Listen is a 3-second channel, so a stun or silence on Deckard ends the sleep early."
  - tag: peel
    why: "Horadric Cube's slow and Scroll of Sealing's root stop divers who commit onto his backline."
counters:
