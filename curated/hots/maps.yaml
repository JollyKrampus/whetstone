# Map profiles and map-fit rules (SPEC §5.1.5). Validated by CuratedMapsFileSchema in
# src/games/hots/schema.ts. The pipeline merges these profiles with heroes-data2 map data
# (images) and the ranked pool to produce maps.json; the theory engine applies `fit` rules
# to produce theory.json `mapFit`. How map fit is scored: docs/THEORY.md.
#
# maps: keyed by our own kebab-case slug.
#   name       English name as the game shows it.
#   kind       standard | aram | brawl (brawl maps are not listed: hidden per critique D11).
#   size       small | medium | large (relative footprint / rotation distance).
#   lanes      1 | 2 | 3
#   objective  one plain sentence, in our own words, describing what the objective does.
#   tags       MAP_TAGS vocabulary:
#                large / small           rotation distances well above / below the average map
#                three-lane / two-lane / single-lane
#                channel-objective       the objective is won by channelling (tributes, altars, nukes, turn-ins)
#                pve-objective           the objective is a race to kill neutral units
#                teamfight               the objective forces five-versus-five fights in one spot
#                structure-objective     the objective damages structures directly
#                long-rotations          objectives spawn far apart, so teams cross the map often
#                escort-objective        a moving payload has to be escorted
#                push-objective          the objective reward is a unit or wave that pushes lanes
#   hp         Heroes Profile map_id and name (join key for map stats).
#
# fit: map tags x hero tags rules. A rule applies when the map has ANY of `map` and the hero
#   satisfies ANY expression in `hero` (same syntax as rules.yaml). Placeholders in `why`:
#   {hero} {map} {heroTag} {mapTag} {evidence}. Negative weights mark poor fits. Heroes with no
#   matching rule on a map get no map-fit entry (neutral). Weights use the same scale as
#   rules.yaml (0.2 -> 60, 0.3 -> 65); talent-only tags count at 0.6x; the sum per hero and map
#   stops at 0.6 (77).
version: 2

maps:
