fit:
  # --- map size and rotations -------------------------------------------------------------
  - id: global-on-large-maps
    map: [large, long-rotations]
    hero: [global]
    weight: 0.3
    why: "{hero}'s map-wide reach ({evidence}) offsets {map}'s long rotations."

  - id: fast-rotation-on-large-maps
    map: [large]
    hero: [teleport]
    weight: 0.1
    why: "{hero} can cover ground quickly ({evidence}) on {map}'s large layout."

  - id: immobile-on-large-maps
    map: [large]
    hero: [immobile]
    weight: -0.15
    why: "{hero} has little mobility to rotate across {map}'s large layout."

  # --- lanes and pushing --------------------------------------------------------------------
  - id: split-push-on-three-lanes
    map: [three-lane]
    hero: [split-push]
    weight: 0.2
    why: "{map} has three lanes for {hero} to pressure while the team holds the objective."

  - id: split-push-on-two-lanes
    map: [two-lane]
    hero: [split-push]
    weight: -0.1
    why: "{map} has only two lanes, so {hero}'s side-lane pressure is easier to answer."

  - id: waveclear-vs-pushing-objectives
    map: [push-objective, structure-objective]
    hero: [waveclear]
    weight: 0.1
    why: "{hero}'s waveclear ({evidence}) helps hold lanes against {map}'s pushing objective."

  - id: siege-on-structure-maps
    map: [structure-objective]
    hero: [siege]
    weight: 0.2
    why: "{hero} can siege structures ({evidence}), which adds to {map}'s objective pressure."

  # --- objective type -----------------------------------------------------------------------
  - id: damage-for-pve-objectives
    map: [pve-objective]
    hero: [sustained-dps, percent-hp-damage]
    weight: 0.2
    why: "{hero}'s {heroTag} ({evidence}) speeds up {map}'s race against neutral units."

  - id: summons-for-pve-objectives
    map: [pve-objective]
    hero: [summons]
    weight: 0.1
    why: "{hero}'s summons ({evidence}) add damage to {map}'s neutral objective."

  - id: mobility-contests-channels
    map: [channel-objective]
    hero: [stealth, global, teleport]
    weight: 0.15
    why: "{hero} can reach channelling enemies quickly ({evidence}) to contest {map}'s objective."

  - id: interrupts-on-channel-maps
    map: [channel-objective]
    hero: [silence, polymorph, sleep, time-stop]
    weight: 0.1
    why: "{hero}'s {heroTag} ({evidence}) stops enemies channelling {map}'s objective."

  - id: frontline-on-escort
    map: [escort-objective]
    hero: [frontline]
    weight: 0.2
    why: "{hero} can stand on {map}'s payload and absorb pressure."

  # --- teamfights ---------------------------------------------------------------------------
  - id: area-burst-in-teamfights
    map: [teamfight]
    hero: ["aoe&burst"]
    weight: 0.2
    why: "{map}'s objective forces teamfights where {hero}'s area burst ({evidence}) hits several targets."

  - id: grouping-in-teamfights
    map: [teamfight]
    hero: [pull, time-stop]
    weight: 0.15
    why: "{hero} can group or freeze enemies ({evidence}) in {map}'s objective fights."

  - id: engage-in-teamfights
    map: [teamfight]
    hero: [engage]
    weight: 0.1
    why: "{hero} can start the fights {map}'s objective forces."

  # --- ARAM -----------------------------------------------------------------------------------
  - id: poke-in-single-lane
    map: [single-lane]
    hero: [poke]
    weight: 0.25
    why: "{map}'s single lane suits {hero}'s poke ({evidence})."

  - id: waveclear-in-single-lane
    map: [single-lane]
    hero: [waveclear]
    weight: 0.1
    why: "{hero}'s waveclear ({evidence}) holds {map}'s single lane."

  - id: divers-in-single-lane
    map: [single-lane]
    hero: [dive]
    weight: -0.1
    why: "{map}'s single lane leaves {hero} little room to flank around the front line."
