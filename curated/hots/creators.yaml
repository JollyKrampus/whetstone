# HotS video creators and featured channels (critique C15, hots-meta-extra §2.1).
# Validated by CreatorsFileSchema in src/games/hots/schema.ts.
#
# Only channels someone checked by hand: active, mostly HotS, and the channel id resolved
# from the handle. Re-check quarterly and bump `verified`. The videos job (YouTube Data API,
# class C, artifact only) reads the youtube channel ids; /hots/live/ shows `featured`
# channels as keyless Twitch embeds.
#   id             our kebab-case id
#   youtube        channelId (UC...) and optional @handle
#   twitch         login, when a Twitch channel was verified
#   lang           BCP 47 language of most titles ("und" = not checked)
#   kinds          guide gameplay tournament patch news coaching official
#   excludeTitles  case-insensitive regexes for non-HotS uploads to skip
