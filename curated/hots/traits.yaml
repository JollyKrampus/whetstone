# Global curated hero traits (SPEC §5.1.2). Validated by TraitsFileSchema in
# src/games/hots/schema.ts and merged by src/games/hots/theory/curated.ts.
#
# Traits are curated per hero: add them under `traits:` in curated/hots/heroes/<slug>.yaml
# (docs/THEORY.md, "Curated traits and per-hero files"). This file is for corrections that do
# not belong to one curator's file and is normally empty. Entries here are applied before the
# per-hero files; the later entry wins when a tag is both added and removed.
#
# Keyed by hero slug (lowercase alphanumerics of the English name: liming, thebutcher,
# chogall for the composite). Each entry:
#   tag   one of HERO_TAGS (e.g. aa-reliant, immobile, dive, split-push, vulnerable-body,
#         frontline, peel, engage, save, or any extractor tag)
#   why   one line a player would accept as true for the current kit, in your own words
#   op    add (default) | remove — `remove` suppresses a wrongly extracted tag
#
# Example (not active):
#   abathur:
#     - tag: vulnerable-body
#       why: Abathur's body is left defenceless while he controls a Symbiote elsewhere.
{}
