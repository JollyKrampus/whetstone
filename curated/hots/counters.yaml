# Global curated counter pairs (SPEC §5.1.4). Validated by CuratedPairsFileSchema in
# src/games/hots/schema.ts and merged by src/games/hots/theory/curated.ts.
#
# Counters are curated per hero: add yours to curated/hots/heroes/<slug>.yaml (docs/THEORY.md,
# "Contributing a counter"). This file stays for pairs that do not belong to one hero's file
# and is normally empty. Entries here and in the per-hero files merge into one edge per pair.
#
# Each pair says: hero `a` is good against hero `b`, for a concrete mechanical reason that
# holds for the current kits. Curated pairs add weight on top of the generic rules in
# rules.yaml and their `why` is shown verbatim as a reason, so write it for players.
#   a, b         hero slugs (chogall for the composite)
#   why          handwritten mechanical reason, consistent with current ability/talent text
#   evidence     ability/talent names the reason relies on (checked against game data)
#   conditions   optional list of talents or situations the matchup depends on
#   confidence   low | medium | high (default weight .2 / .4 / .6)
#   weight       optional override of the confidence weight
#   reviewedFor  major patch the entry was last checked against, e.g. "2.57"
#
# Example (not active):
#   pairs:
#     - a: johanna
#       b: valla
#       why: Shield Glare blinds Valla, and most of her damage comes from basic attacks.
#       evidence: [Shield Glare]
#       confidence: medium
#       reviewedFor: "2.57"
pairs: []
