# Pull requests and pushes: lint, type-check, unit tests, a build against committed fixtures and
# the Playwright smoke suite. No secrets, no network data, no deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (astro check + pipeline tsc)
        run: npm run check

      - name: Unit tests
        run: npm test

      # Curated counters, synergies and traits: schema, merge conflicts and evidence names.
      - name: Validate the HotS theory files
        run: node src/games/hots/theory/validate.ts

      # No data/ and no WHETSTONE_DATA_DIR here, so every game builds from fixtures/.
      - name: Build against fixtures
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run e2e

      # Private-data mode: the synthetic samples in fixtures/<game>/_private
      # (WHETSTONE_FIXTURE_PRIVATE=1; stage.ts also merges their public/ overlays into the shards,
      # under _private/). A separate output directory and port, so it cannot be confused with the
      # build above (e2e/global-setup.ts checks which build the server serves).
      - name: Build with the private samples
        run: npm run build
        env:
          WHETSTONE_FIXTURE_PRIVATE: '1'
          WHETSTONE_OUT_DIR: .cache/dist-stats

      - name: E2E with the private samples (HotS pages, draft and ARAM)
        run: npx playwright test e2e/hots-pages.spec.ts e2e/hots-draft.spec.ts
        env:
          WHETSTONE_FIXTURE_PRIVATE: '1'
          WHETSTONE_OUT_DIR: .cache/dist-stats
          SMOKE_PORT: '4322'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
