# Pull requests and pushes: lint, type-check, unit tests, a build against committed fixtures and
# the Playwright smoke suite. No secrets, no network data, no deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (astro check + pipeline tsc)
        run: npm run check

      - name: Unit tests
        run: npm test

      # Curated counters, synergies and traits: schema, merge conflicts and evidence names.
      - name: Validate the HotS theory files
        run: node src/games/hots/theory/validate.ts

      # No data/ and no WHETSTONE_DATA_DIR here, so every game builds from fixtures/.
      - name: Build against fixtures
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run e2e

      # Statistics mode: the synthetic Heroes Profile, YouTube and Twitch samples in
      # fixtures/hots/_private (WHETSTONE_FIXTURE_PRIVATE=1; stage.ts also merges the draft shard's
      # stats overlay). A separate output directory and port, so it cannot be confused with the
      # theory build above (e2e/global-setup.ts checks which build the server serves).
      - name: Build in statistics mode
        run: npm run build
        env:
          WHETSTONE_FIXTURE_PRIVATE: '1'
          WHETSTONE_OUT_DIR: .cache/dist-stats

      - name: E2E in statistics mode (HotS pages, draft and ARAM)
        run: npx playwright test e2e/hots-pages.spec.ts e2e/hots-draft.spec.ts
        env:
          WHETSTONE_FIXTURE_PRIVATE: '1'
          WHETSTONE_OUT_DIR: .cache/dist-stats
          SMOKE_PORT: '4322'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
